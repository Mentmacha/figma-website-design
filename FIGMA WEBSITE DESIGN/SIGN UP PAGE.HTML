
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Locate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet"
    >
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        playfair: ['"Playfair Display"', 'serif'],
                        poppins: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="m-0 min-h-screen w-full overflow-x-hidden bg-[#dcecff] font-poppins">
    <main
        class="
            relative
            left-0
            m-0
            h-screen
            min-h-[600px]
            w-full
            overflow-hidden
            p-0">
        <section
            class="
                relative
                h-full
                min-h-full
                w-full
                overflow-hidden
                bg-[#dcecff]
                bg-[url('image.png')]
                bg-cover
                bg-[position:bottom_right]
                bg-no-repeat
                max-[900px]:bg-center" >
            <div
                class="
                    pointer-events-none
                    absolute
                    inset-0
                    z-[1]
                    h-full
                    w-full
                    bg-[linear-gradient(to_right,rgba(220,236,255,0)_1%,rgba(220,236,255,0.29)_8%,rgba(220,236,255,0)_20%,rgba(220,236,255,0.65)_32%,rgba(220,236,255,0)_45%,rgba(220,236,255,0.12)_58%,rgba(220,236,255,0)_72%),linear-gradient(to_bottom,rgba(220,236,255,0.256)_1%,rgba(220,236,255,0.447)_18%,rgba(220,236,255,0)_35%,rgba(220,236,255,0.093)_55%,rgba(220,236,255,0)_75%,rgba(220,236,255,0)_100%)]"
            ></div>
            <div
                class="
                    pointer-events-none
                    absolute
                    left-0
                    top-0
                    z-[2]
                    h-full
                    w-[55%]
                    bg-[linear-gradient(to_right,rgba(220,236,255,0.95)_0%,rgba(220,236,255,0.82)_18%,rgba(220,236,255,0.55)_38%,rgba(220,236,255,0.25)_62%,rgba(220,236,255,0)_100%)]
                    max-[900px]:w-[65%]
                    max-[700px]:w-[75%]
                    max-[480px]:w-[85%]"
            ></div>
            <header
                class="
                    absolute
                    left-[clamp(15px,7vw,120px)]
                    right-[clamp(15px,7vw,120px)]
                    top-[clamp(20px,5vh,50px)]
                    z-10

                    flex
                    min-h-[clamp(50px,6vh,65px)]
                    items-center

                    bg-[rgba(255,255,255,0.96)]

                    px-[clamp(12px,2vw,22px)]

                    max-[900px]:left-[4%]
                    max-[900px]:right-[4%]
                    max-[900px]:min-h-[55px]

                    max-[700px]:left-[15px]
                    max-[700px]:right-[15px]
                    max-[700px]:top-[20px]
                    max-[700px]:min-h-[52px]
                    max-[700px]:px-3

                    max-[480px]:left-3
                    max-[480px]:right-3
                    max-[480px]:top-[15px]
                    max-[480px]:min-h-[50px]

                    max-[360px]:left-2
                    max-[360px]:right-2
                    max-[360px]:px-[9px]">
                <div
                    class="
                        flex
                        w-[clamp(90px,10vw,140px)]
                        shrink-0
                        flex-col
                        justify-center
                        font-sans
                        text-[clamp(15px,1.5vw,21px)]
                        font-bold
                        leading-[0.72]
                        max-[700px]:w-[100px]
                        max-[700px]:text-[17px]
                        max-[480px]:w-[90px]
                        max-[480px]:text-[16px]
                        max-[360px]:w-[75px]
                        max-[360px]:text-[14px]">
                    <span class="text-[#0785ed]">
                        Track
                    </span>
                    <span class="text-[#ff7600]">
                        locate
                    </span>
                </div>
                <nav
                    class="
                        flex
                        flex-1
                        items-center
                        justify-center

                        gap-[clamp(15px,2.5vw,38px)]
                        mx-[10px]

                        max-[900px]:gap-[14px]
                        max-[700px]:hidden">
                    <a
                        href="SIGN UP PAGE.HTML"
                        class="
                            relative
                            whitespace-nowrap
                            text-[clamp(9px,0.85vw,13px)]
                            text-[#007ce8]
                            no-underline
                            transition-colors
                            duration-200">
                        Home
                        <span
                            class="
                                absolute
                                bottom-[-10px]
                                left-1/2
                                h-[2px]
                                w-[clamp(30px,3vw,45px)]
                                -translate-x-1/2
                                bg-[#168de8]"></span>
                    </a>
                    <a
                        href="ABOUT.HTML"
                        class="
                            whitespace-nowrap
                            text-[clamp(9px,0.85vw,13px)]
                            text-[#555]
                            no-underline
                            transition-colors
                            duration-200
                            hover:text-[#007ce8]">
                        About
                    </a>
                    <a
                        href="COST.HTML"
                        class="
                            whitespace-nowrap
                            text-[clamp(9px,0.85vw,13px)]
                            text-[#555]
                            no-underline
                            transition-colors
                            duration-200
                            hover:text-[#007ce8]">
                        Pricing
                    </a>
                    <a
                        href="CONTACT US.HTML"
                        class="
                            whitespace-nowrap
                            text-[clamp(9px,0.85vw,13px)]
                            text-[#555]
                            no-underline
                            transition-colors
                            duration-200
                            hover:text-[#007ce8]">
                        Contact Us
                    </a>
                </nav>
                <div
                    class="
                        flex
                        shrink-0
                        items-center
                        gap-[clamp(6px,1vw,14px)]
                        max-[700px]:ml-auto">
                    <a
                        href="GETTING STARTED.HTML"
                        class="
                            flex
                            h-[clamp(30px,3.5vw,38px)]
                            w-[clamp(65px,7vw,100px)]
                            items-center
                            justify-center
                            whitespace-nowrap
                            bg-[#087fee]
                            text-[clamp(8px,0.8vw,12px)]
                            text-white
                            no-underline
                            transition-colors
                            duration-200
                            hover:bg-[#0674d8]
                            max-[900px]:h-[31px]
                            max-[900px]:w-[75px]
                            max-[900px]:text-[9px]
                            max-[700px]:h-[30px]
                            max-[700px]:w-[72px]
                            max-[700px]:text-[9px]
                            max-[480px]:h-7
                            max-[480px]:w-[65px]
                            max-[480px]:text-[8px]
                            max-[360px]:h-[26px]
                            max-[360px]:w-[58px]
                            max-[360px]:text-[7px]">
                        Get Started
                    </a>
                    <a
                        href=""
                        class="
                            flex
                            h-[clamp(30px,3.5vw,38px)]
                            w-[clamp(65px,7vw,100px)]
                            items-center
                            justify-center
                            whitespace-nowrap
                            border
                            border-[#9bcfff]
                            bg-white
                            text-[clamp(8px,0.8vw,12px)]
                            text-[#0076e6]
                            no-underline
                            transition-colors
                            duration-200
                            hover:bg-[#f5faff]
                            max-[900px]:h-[31px]
                            max-[900px]:w-[75px]
                            max-[900px]:text-[9px]
                            max-[700px]:h-[30px]
                            max-[700px]:w-[72px]
                            max-[700px]:text-[9px]
                            max-[480px]:h-7
                            max-[480px]:w-[65px]
                            max-[480px]:text-[8px]
                            max-[360px]:h-[26px]
                            max-[360px]:w-[58px]
                            max-[360px]:text-[7px]">
                        Sign In
                    </a>
                </div>
            </header>
            <div
                class="
                    absolute
                    left-1/2
                    top-[clamp(120px,19vh,210px)]
                    z-[5]
                    w-full
                    -translate-x-1/2
                    px-[clamp(18px,4vw,50px)]
                    text-center
                    max-[900px]:top-[19vh]
                    max-[700px]:top-[16vh]
                    max-[700px]:px-5
                    max-[480px]:top-[15vh]
                    max-[480px]:px-[18px]
                    max-[360px]:top-[14vh]">
                <h1
                    class="
                        mx-auto
                        w-full
                        max-w-[1100px]
                        font-playfair
                        text-[clamp(38px,5vw,76px)]
                        font-normal
                        leading-[1.02]
                        tracking-[clamp(-1.5px,-0.15vw,-2px)]
                        text-[#111]
                        max-[900px]:text-[clamp(40px,6vw,58px)]
                        max-[700px]:text-[clamp(36px,9vw,48px)]
                        max-[700px]:leading-[1.05]
                        max-[480px]:text-[clamp(32px,10vw,42px)]
                        max-[480px]:tracking-[-0.8px]
                        max-[360px]:text-[30px]">
                    <span class="text-[#0078ed]">
                        Smart tracking
                    </span>
                    solutions
                    <br>
                    for
                    <span class="text-[#0078ed]">
                        your vehicle
                    </span>
                </h1>
                <p
                    class="
                        mx-auto
                        mt-[clamp(14px,2vh,24px)]
                        w-full
                        max-w-[750px]
                        text-[clamp(10px,1vw,14px)]
                        leading-[1.7]
                        text-[#777]
                        max-[900px]:w-[85%]
                        max-[900px]:max-w-[650px]
                        max-[900px]:text-[11px]
                        max-[700px]:w-full
                        max-[700px]:max-w-[500px]
                        max-[700px]:text-[11px]
                        max-[700px]:leading-[1.65]
                        max-[480px]:mt-[18px]
                        max-[480px]:text-[10px]">
                    Real-time GPS tracking that keeps your business moving forward
                    that monitor, optimize,<br class="max-[700px]:hidden">
                    and secure your vehicles with ease.
                </p>
                <div
                    class="
                        mt-[clamp(14px,1.8vh,20px)]
                        flex
                        items-center
                        justify-center
                        gap-[clamp(8px,1.2vw,15px)]
                        max-[700px]:mt-[18px]
                        max-[480px]:mt-4
                        max-[480px]:gap-2">
                    <a
                        href="GETTING STARTED.HTML"
                        class="
                            flex
                            h-[clamp(34px,3.5vw,42px)]
                            w-[clamp(85px,8vw,110px)]
                            items-center
                            justify-center
                            bg-[#0785ed]
                            text-[clamp(9px,0.85vw,12px)]
                            text-white
                            no-underline
                            transition-colors
                            duration-200
                            hover:bg-[#0674d8]
                            max-[700px]:h-9
                            max-[700px]:w-[88px]
                            max-[700px]:text-[10px]
                            max-[480px]:h-[34px]
                            max-[480px]:w-[82px]
                            max-[480px]:text-[9px]">
                        Get Started
                    </a>
                    <a
                        href="#"
                        class="
                            flex
                            h-[clamp(34px,3.5vw,42px)]
                            w-[clamp(85px,8vw,110px)]
                            items-center
                            justify-center
                            border
                            border-[#b9dfff]
                            bg-[rgba(255,255,255,0.95)]
                            text-[clamp(9px,0.85vw,12px)]
                            text-[#007ce8]
                            no-underline
                            transition-colors
                            duration-200
                            hover:bg-white
                            max-[700px]:h-9
                            max-[700px]:w-[88px]
                            max-[700px]:text-[10px]
                            max-[480px]:h-[34px]
                            max-[480px]:w-[82px]
                            max-[480px]:text-[9px]">
                        Sign In
                    </a>
                </div>
            </div>
        </section>
    </main>

</html>
