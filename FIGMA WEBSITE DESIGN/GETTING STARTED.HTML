<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Track Locate | Pricing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" >
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

        }

        body {

            background: #020D19;

            font-family: "Inter", sans-serif;

        }
        .pricing-carousel {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            overscroll-behavior-x: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;

        }

        .pricing-carousel::-webkit-scrollbar {
            display: none;
        }
        .pricing-slide {
            position: relative;
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            overflow: hidden;
        }
        .pricing-slide img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            user-select: none;
            -webkit-user-drag: none;
        }
        @media (max-width: 768px) {
            .pricing-slide img {
                object-fit: cover;
                object-position: center;
            }
        }
    </style>
</head>
<body>
    <main
        class="
            w-screen
            h-screen
            overflow-hidden
            bg-[#020D19]">
        <div
            class="
                pricing-carousel
                w-screen
                h-screen
                touch-pan-x" >
            <section
                class="
                    pricing-slide
                    flex
                    items-center
                    justify-center">
                <img
                    src="PRICING PAGE IMAGE 1.png"
                    alt="Track Locate Pricing Page 1"
                    draggable="false"
                    class="
                        w-full
                        h-full
                        object-cover
                        object-center
                        select-none">
            </section>
            <section
                class="
                    pricing-slide
                    flex
                    items-center
                    justify-center">
                <img
                    src="PRICING PAGE IMAGE 2.png"
                    alt="Track Locate Pricing Page 2"
                    draggable="false"
                    class="
                        w-full
                        h-full
                        object-cover
                        object-center
                        select-none">
            </section>
            <section
                class="
                    pricing-slide
                    flex
                    items-center
                    justify-center">
                <img
                    src="PRICING IMAGE 3.png"
                    alt="Track Locate Pricing Page 3"
                    draggable="false"
                    class="
                        w-full
                        h-full
                        object-cover
                        object-center
                        select-none">
            </section>
            <section
                class="
                    pricing-slide
                    flex
                    items-center
                    justify-center">
                <img
                    src="PRICING IMAGE 4.png"
                    alt="Track Locate Pricing Page 4"
                    draggable="false"
                    class="
                        w-full
                        h-full
                        object-cover
                        object-center
                        select-none">
            </section>
        </div>
    </main>
</body>
</html>
